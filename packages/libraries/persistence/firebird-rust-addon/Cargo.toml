[package]
name = "firebird-rust-addon"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"
rsfbclient = { version = "0.27", default-features = false, features = ["dynamic_loading"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
