[package]
name = "downdraft-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Unified native platform library for Downdraft — windowing (winit), GPU (wgpu), image decode, text rasterization, WGSL validation"

[lib]
name = "downdraft_platform"
crate-type = ["cdylib", "rlib"]

# Dependencies are added per porting phase:
#   image    — image_shim_*  (replaces stb_image)
#   cosmic-text — ft_shim_*  (replaces SDL2_ttf)
#   winit + arboard + rfd — dd_window_* (replaces SDL2)
#   wgpu 29             — wgpu_shim_* (replaces wgpu-native + webgpu.h)
#   naga                  — dd_wgsl_validate (replaces the tint binary)
[dependencies]
image = "0.25"
cosmic-text = "0.19"
winit = "0.30"
raw-window-handle = "0.6"
wgpu = "30"

# No Android backend for either — dd_window_* clipboard/dialog paths are
# stubbed under cfg(android) in src/window/mod.rs.
# Global-hotkey grabs go through a dedicated X11 connection (XGrabKey on
# root); Wayland/macOS/Windows have no equivalent here and return -1.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14"

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = "3"
rfd = "0.17"
notify-rust = "4"
portable-pty = "0.9"

# Native app menus — win32 HMENU / NSMenu only. muda's Linux backend needs a
# gtk::Window we don't have (our window is a raw winit surface), so Linux
# dd_menu_* report unsupported and the html-ui in-window menu bar takes over.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
muda = "0.21"
tray-icon = { version = "0.26", default-features = false }

# On Linux/*BSD, muda builds with its noop platform (default-features off,
# snapshot on) — menu MODELS still construct (the tray's ksni backend
# serializes them over DBus); only window-menu attach is unsupported.
# tray-icon's ksni backend is pure-DBus StatusNotifierItem — no GTK or
# libappindicator runtime dependency at all.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd", target_os = "dragonfly"))'.dependencies]
muda = { version = "0.21", default-features = false, features = ["snapshot"] }
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

# Dialog/notify opts arrive as JSON from the JS bridge.
[target.'cfg(not(target_os = "android"))'.dependencies.serde_json]
version = "1"

# android-activity requires the leaf crate to pick a backend; native-activity
# matches our NativeActivity-based shell (no Java GameActivity needed).
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
libc = "0.2"
