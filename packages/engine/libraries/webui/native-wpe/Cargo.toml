[package]
name = "downdraft-webui-wpe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Heavyweight browser-backed UI — WPE (embedded WebKit) backend behind the dd_webui_* ABI"
build = "build.rs"

[lib]
name = "downdraft_webui_wpe"
crate-type = ["cdylib", "rlib"]

[dependencies]
downdraft-webui-common = { path = "../native-common" }

[target.'cfg(target_os = "android")'.dependencies]
# WKRuntime.getInstance().initialize(Context) bootstrap + the app's JNI
# context (registered by android-shell at boot).
jni = "0.22"
ndk-context = "0.1"

# glib/gobject/wpe link setup happens in build.rs against the vendored WPE
# prefix (../vendor/wpe-<plat>) — see Phase 2.
