[package]
name = "downdraft-audio"
version = "0.1.0"
edition = "2021"

[lib]
name = "downdraft_audio"
crate-type = ["cdylib"]

# Dormant — excluded from the workspace. The source targets a pre-0.8 kira
# API (StaticSoundData::from_wav_bytes, CpalBackend::new, etc. no longer
# exist); it needs a port, not a version bump, when revived.
[dependencies]
kira = "0.9"
symphonia = { version = "0.5", features = ["mp3", "ogg", "flac", "wav", "pcm"] }
