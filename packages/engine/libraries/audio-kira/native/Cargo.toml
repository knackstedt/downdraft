[package]
name = "downdraft-audio"
version = "0.1.0"
edition = "2021"

[lib]
name = "downdraft_audio"
crate-type = ["cdylib"]

[dependencies]
# kira's default features pull symphonia with mp3/ogg/flac/wav decode —
# StaticSoundData::from_cursor covers every format the FFI accepts, so no
# direct symphonia dependency is needed.
kira = "0.9"
