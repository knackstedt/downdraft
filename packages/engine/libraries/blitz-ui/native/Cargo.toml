[package]
name = "downdraft-blitz-shell"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared headless Blitz/Dioxus UI shell for Downdraft games (native Bun + browser wasm)"

[lib]
crate-type = ["rlib"]

[dependencies]
dioxus-core = "0.7.3"
dioxus-signals = "0.7.3"
dioxus-native = { git = "https://github.com/DioxusLabs/blitz", rev = "efef6519fe6520caf66dc82df557580eecbf652b", default-features = false, features = ["prelude", "vello-cpu-softbuffer", "woff"] }
dioxus-native-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "efef6519fe6520caf66dc82df557580eecbf652b" }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "efef6519fe6520caf66dc82df557580eecbf652b", default-features = false }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "efef6519fe6520caf66dc82df557580eecbf652b" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "efef6519fe6520caf66dc82df557580eecbf652b", features = ["custom-widget"] }
anyrender_vello_cpu = "0.17.0"
anyrender = "0.13.0"
parley = { version = "0.11.1", default-features = false, features = ["std"] }
linebender_resource_handle = "0.1"
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
keyboard-types = "0.7"
smol_str = "0.3"
atomic_refcell = "0.1"
web-time = "1"
# Workaround copied from blitz examples: disable unicode URL support
# (see https://github.com/hsivonen/idna_adapter)
idna_adapter = "=1.0.0"

# Enable the vendored glifo's FreeType mask path (see [patch.crates-io] in the
# workspace root). Feature unification turns it on inside vello_cpu's copy.
# Target-gated: freetype-sys compiles bundled C, which wasm32 can't build.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
glifo = { version = "0.2", features = ["freetype"] }
