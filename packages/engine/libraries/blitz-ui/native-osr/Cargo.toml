[package]
name = "downdraft-blitz-osr"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false
description = "Headless Blitz HtmlDocument rasterizer exposed over a C ABI (native OSR spike)"

[lib]
name = "downdraft_blitz_osr"
crate-type = ["cdylib"]

[dependencies]
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "efef6519fe6520caf66dc82df557580eecbf652b" }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "efef6519fe6520caf66dc82df557580eecbf652b", default-features = false, features = ["woff"] }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "efef6519fe6520caf66dc82df557580eecbf652b" }
# scrollbars: painted overlay thumbs on scroll containers + thumb drag/hover
# hit-testing (pulls blitz-dom/scrollbars transitively). No custom-widget:
# OSR docs never embed widget nodes, and the feature transitively enables
# blitz-dom/accessibility (+accesskit) the OSR path never uses.
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "efef6519fe6520caf66dc82df557580eecbf652b", features = ["scrollbars"] }
# Same rev blitz-dom resolves to — needed to name taffy::Display for the
# display:none check in dd_osr_node_rect.
taffy = { git = "https://github.com/DioxusLabs/taffy", rev = "4863877b9cab21645b160d7f247901f90214fe27", default-features = false }
# Same stylo build blitz-dom links — needed to read RestyleDamage bits and
# paint-bleed styles (box-shadow/filter/outline) in damage.rs.
style = { version = "0.21.0", package = "stylo", default-features = false }
# Enable the vendored glifo's FreeType mask path (see [patch.crates-io] in the
# workspace root). Feature unification turns it on inside vello_cpu's copy.
glifo = { version = "0.2", features = ["freetype"] }
anyrender_vello_cpu = "0.17.0"
anyrender = "0.13.0"
# GPU raster path: paint_scene encodes into a vello::Scene here (no wgpu —
# the .so holds only the encoding; libdowndraft_platform's wgpu_shim_vello_*
# renders it on the shared device). vello_encoding is named directly for the
# ABI handshake — both cdylibs must resolve the identical version.
vello = { version = "0.11", default-features = false }
vello_encoding = "=0.11.0"
atomic_refcell = "0.1"
keyboard-types = "0.7"
linebender_resource_handle = "0.1"
env_logger = "0.11.11"
# System clipboard for blitz text editing (Ctrl+C/X/V) — same crate the
# platform shim uses; no Android backend (clipboard ops no-op there).
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = "3"
# Workaround copied from blitz examples: disable unicode URL support
# (see https://github.com/hsivonen/idna_adapter)
idna_adapter = "=1.0.0"
