[package]
name = "downdraft-raw-input"
version = "0.1.0"
edition = "2021"
description = "Native raw mouse capture for the Downdraft engine (napi-rs)"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi8", "tokio_rt"] }
napi-derive = "2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code", "xinput", "cursor", "randr", "shape"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
strip = true
