# Bun configuration for Downdraft Engine
#
# The preload script registers Bun.plugin() loaders that handle Vite-specific
# import patterns (?raw, ?url, .css) so engine code runs unchanged under Bun.
#
# In Vite/Electron mode, this file is ignored — Vite has its own loaders.

preload = ["./packages/core/src/platform/bun-preload.ts"]

[test]
# Bun test configuration
root = "."
