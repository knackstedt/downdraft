[package]
name = "bakeoff-blitz-ui"
version = "0.1.0"
edition = "2021"
publish = false
description = "Dioxus component gallery for the ui-bakeoff test bed (compiles to wasm)"

[lib]
crate-type = ["cdylib"]

[dependencies]
downdraft-blitz-shell = { path = "../../../packages/engine/libraries/blitz-ui/native" }
dioxus = "=0.7.3"
dioxus-core = "=0.7.3"
dioxus-signals = "=0.7.3"
dioxus-html = "=0.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.121"
js-sys = "0.3"
console_error_panic_hook = "0.1"
