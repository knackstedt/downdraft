[package]
name = "native-renderer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "native-renderer"
path = "src/main.rs"

[dependencies]
wgpu = "24"
winit = "0.30"
pollster = "0.3"
bytemuck = { version = "1.21", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ul-next = { version = "0.5", features = ["loaded"] }
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = true
