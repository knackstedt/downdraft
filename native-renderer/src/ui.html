<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: transparent;
    font-family: 'Segoe UI', Ubuntu, Arial, sans-serif;
    color: #e0e0e0;
  }
  #fps-counter {
    position: absolute;
    top: 12px; left: 12px;
    padding: 6px 12px;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #59F3AA;
    pointer-events: none;
    z-index: 100;
  }
  #devtools-btn {
    position: absolute;
    top: 12px; right: 12px;
    padding: 6px 12px;
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    font-size: 13px;
    color: #ccc;
    cursor: pointer;
    z-index: 100;
  }
  #devtools-btn:hover {
    background: rgba(255,255,255,0.15);
  }
  #status {
    position: absolute;
    bottom: 12px; left: 12px;
    padding: 6px 12px;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 6px;
    font-size: 12px;
    color: #aaa;
    pointer-events: none;
    z-index: 100;
  }
</style>
</head>
<body>
  <div id="fps-counter">FPS: --</div>
  <div id="devtools-btn">DevTools</div>
  <div id="status">DownDraft Engine - Native Renderer</div>
</body>
</html>
