# Root Cargo workspace — one lockfile, one `cargo build`, one target dir for
# every native artifact in the repo. Build via `node scripts/build-native.mjs`
# (cross-platform replacement for the old per-crate build.sh scripts).
#
# Member crates are cdylibs loaded by the engine via bun:ffi/koffi. They are
# NOT published to crates.io.
[workspace]
resolver = "2"
members = [
    # Unified platform library — windowing (winit), GPU (wgpu), image decode,
    # text rasterization, WGSL validation. Replaces native/*.c.
    "packages/platform-native/native-rs",
    # Optional gamepad backend (gilrs). Separate cdylib so its libudev link
    # dep can't take down the platform library on systems without udev.
    "packages/platform-native/native-gamepad",
    # Optional OS keychain backend (keyring). Separate cdylib — zbus/dbus on
    # Linux must not become a load-time dep of downdraft_platform.
    "packages/platform-native/native-secrets",
    "packages/engine/libraries/physics-native/native",
    "packages/engine/libraries/blitz-ui/native",
    "packages/engine/libraries/blitz-ui/native-osr",
    "packages/engine/libraries/audio-kira/native",
    "test-beds/ui-bakeoff/blitz-app",
    # Android NativeActivity shell — cdylib that embeds libnode and statically
    # links downdraft-platform (JS dlopens the shell .so for FFI on Android).
    "packages/android-shell",
]

# Materialized Node source trees (packages/node-mobile/build/node-v*) contain
# a vendored deps/crates/Cargo.toml that must not join this workspace.
exclude = ["packages/node-mobile/build"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Vendored arboard 3.6.1 — upstream's X11 serve path advertises UTF-8 MIME
# aliases in TARGETS but only replies to the exact stored atom, so requesters
# that ask for text/plain;charset=utf-8 (Qt/Klipper) get an empty response and
# the clipboard keeps stale contents. vendor/arboard adds the alias fallback in
# handle_selection_request.
[patch.crates-io]
arboard = { path = "vendor/arboard" }

# Vendored glifo 0.2.0 — text-quality patch for the html-ui stack:
# - requests SmoothMode::Normal hinting (pixel grid) rather than Lcd
#   (subpixel grid that vello_cpu's grayscale rasterizer never decimates to)
# - applies a light synthetic embolden to hinted runs (stem darkening —
#   blitz-paint's own embolden feature disables hinting entirely, so we
#   do it here where hint + expand_path compose cleanly)
# NOTE: snapping glyph x-offsets to integers was tried and reverted —
# crisper stems but visibly inconsistent letter spacing; fractional
# positions with per-phase atlas buckets (like Chrome grayscale) win.
glifo = { path = "vendor/glifo" }

# `cargo build --release` stays fast for local dev. CI artifact builds use
# `cargo build --profile dist` — fat LTO + single codegen unit, matching what
# the old per-crate release profiles did for the blitz natives.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = "symbols"
