# Root Cargo workspace — one lockfile, one `cargo build`, one target dir for
# every native artifact in the repo. Build via `node scripts/build-native.mjs`
# (cross-platform replacement for the old per-crate build.sh scripts).
#
# Member crates are cdylibs loaded by the engine via bun:ffi/koffi. They are
# NOT published to crates.io.
[workspace]
resolver = "2"
members = [
    # Unified platform library — windowing (winit), GPU (wgpu), image decode,
    # text rasterization, WGSL validation. Replaces native/*.c.
    "packages/platform-native/native-rs",
    # Optional gamepad backend (gilrs). Separate cdylib so its libudev link
    # dep can't take down the platform library on systems without udev.
    "packages/platform-native/native-gamepad",
    "packages/engine/libraries/physics-native/native",
    "packages/engine/libraries/devtools/native",
    "packages/engine/libraries/blitz-ui/native",
    "packages/engine/libraries/blitz-ui/native-osr",
    "packages/engine/libraries/audio-kira/native",
    "test-beds/ui-bakeoff/blitz-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# `cargo build --release` stays fast for local dev. CI artifact builds use
# `cargo build --profile dist` — fat LTO + single codegen unit, matching what
# the old per-crate release profiles did for the blitz natives.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
strip = "symbols"
