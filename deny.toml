# cargo-deny configuration — license + advisory checks for the Rust workspace.
# Run: cargo deny check   (CI: .github/workflows/ci.yml)

[licenses]
# The workspace ships cdylibs linked into distributable binaries — only
# permissive + copyleft-compatible-with-dynamic-linking licenses allowed.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
  # Servo CSS stack pulled in by Blitz (stylo/cssparser/selectors/...) —
  # file-level weak copyleft; we ship unmodified deps so only per-file
  # source-offer obligations apply.
  "MPL-2.0",
  # BSD-style permissive licenses seen in the tree.
  "NCSA",
  "bzip2-1.0.6",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# CEF/WPE backend crates link LGPL-2.1 web engines dynamically — LGPL is not
# in the allow list; those crates are opted in below if needed.
exceptions = []

[advisories]
# Fail on known security advisories in the dependency tree.
yanked = "deny"
ignore = [
  # Unmaintained transitive deps in the Blitz/parley text stack — INFO
  # advisories, not vulnerabilities; no patched versions exist to upgrade
  # to. Tracked as upstream migrations (harfrust/skrifa alternatives).
  "RUSTSEC-2024-0436", # paste
  "RUSTSEC-2026-0192", # ttf-parser
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Only crates.io + explicitly allowed git sources.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
