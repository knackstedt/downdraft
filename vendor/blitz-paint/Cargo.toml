[package]
name = "blitz-paint"
description = "Paint a Blitz Document using anyrender"
documentation = "https://docs.rs/blitz-paint"
version = "0.3.0-beta.2"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/dioxuslabs/blitz"
repository = "https://github.com/dioxuslabs/blitz"
categories = ["gui"]
edition = "2024"
rust-version = "1.91.0"

[features]
default = ["svg"]
tracing = ["dep:tracing"]
svg = ["dep:anyrender_svg", "dep:usvg", "blitz-dom/svg"]
custom-widget = ["blitz-dom/custom-widget"]
font-embolden = []
apple-font-embolden = []
# Paint overlay scrollbar thumbs on scroll containers, and enable their
# drag/hover interaction in blitz-dom (off by default while the feature
# matures).
scrollbars = ["blitz-dom/scrollbars"]

[dependencies]
# Blitz dependencies
anyrender = "0.13.0"
anyrender_svg = { version = "0.14.0", optional = true }
# Sibling crates stay on the upstream pin — this vendor copy patches the
# git source, not the whole workspace (see root Cargo.toml [patch]).
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "efef6519fe6520caf66dc82df557580eecbf652b" }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "efef6519fe6520caf66dc82df557580eecbf652b" }

# Servo dependencies
style = { version = "0.21.0", package = "stylo" }
euclid = "0.22"

# DioxusLabs dependencies
taffy = { git = "https://github.com/DioxusLabs/taffy", rev = "4863877b9cab21645b160d7f247901f90214fe27", default-features = false, features = [
    "std",
    "flexbox",
    "grid",
    "block_layout",
    "content_size",
    "calc",
    "detailed_layout_info",
] }

# Linebender + WGPU dependencies
parley = { version = "0.11.1", default-features = false, features = ["std"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
color = "0.3"
peniko = "0.6.0"
kurbo = "0.13.1"
usvg = { version = "0.48.1", optional = true }

# Other dependencies
smallvec = "1"
tracing = { version = "0.1.40", optional = true }
