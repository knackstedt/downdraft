<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PixiJS Polyfill Test Harness</title>
  <!--
    Load the exact TTF the native FreeType rasterizer uses, so the browser
    reference and the native polyfill render the same glyphs. The native
    side ignores fontFamily and always renders DejaVuSans.ttf; here we
    register DejaVu Sans (regular + bold) under the family name "DejaVu Sans".
  -->
  <style>
    @font-face {
      font-family: "DejaVu Sans";
      src: url("/assets/DejaVuSans.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "DejaVu Sans";
      src: url("/assets/DejaVuSans-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
    }
    #canvas {
      display: block;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script type="module" src="/entry.js"></script>
</body>
</html>
