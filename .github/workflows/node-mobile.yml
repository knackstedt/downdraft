name: Node mobile (Android libnode)

# Builds libnode.so for Android from the overlay recipe in
# packages/node-mobile (pristine upstream Node + patch series), and uploads
# downdraft-node-mobile-android-<arch>.tar.gz bundles to a GitHub release
# tagged node-mobile-v<node-version>-<revision>.
# stage-node-packages.mjs populates the @downdraft/native-mobile-android-*
# npm packages from the same bundles during publish.yml.
#
# Trigger manually (workflow_dispatch) or by pushing a node-mobile-v* tag.

on:
  workflow_dispatch:
  # reusable: publish.yml calls this on v* tags when the release is incomplete
  workflow_call:
  push:
    tags: ["node-mobile-v*"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          VER=$(tr -d '[:space:]' < packages/node-mobile/node-version.txt)
          REV=$(grep -oP 'NODE_MOBILE_REVISION \K\d+' packages/node-mobile/overlay/src/node_mobile_version.h)
          echo "tag=node-mobile-v${VER}-${REV}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, abi: arm64-v8a, pkgArch: arm64 }
          - { arch: x86_64, abi: x86_64, pkgArch: x64 }

    runs-on: ubuntu-latest
    # GitHub-hosted runners hard-cap jobs at 360 min — a cold V8+Node build
    # (~6h on 4 vCPUs) can exceed it. The build therefore runs in a bounded
    # slice and caches the whole source tree+out/ per attempt: on timeout the
    # job fails cleanly, and "Re-run failed jobs" resumes incrementally.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # A cold V8+Node build produces ~15 GB of objects; ubuntu-latest has
      # ~25 GB free after dotnet/toolcache bloat. Reclaim the unused SDKs —
      # keep the JDK (sdkmanager needs it) and the Android SDK.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
          docker image prune -af || true
          df -h /

      # NDK r30 — pinned for reproducibility. V8 14.6 needs clang ≥20 on the
      # target side (consteval immediate-invocation in the regexp engine —
      # r28's clang 19 fails); r30 ships clang 21.
      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370"

      - name: Restore partial build tree (attempt resume)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/node-mobile/build/node-v26.10.0
          key: nodemobile-tree-${{ matrix.abi }}-${{ github.run_id }}-a${{ github.run_attempt }}
          restore-keys: |
            nodemobile-tree-${{ matrix.abi }}-${{ github.run_id }}-

      - name: Materialize Node source tree
        run: |
          if [ -f "packages/node-mobile/build/node-v26.10.0/.node-mobile-prepared" ]; then
            echo "Restored prepared tree from cache — skipping prepare"
          else
            node packages/node-mobile/scripts/prepare.mjs
          fi

      - name: Build libnode.so (${{ matrix.abi }})
        id: build
        env:
          NODEJS_MOBILE_SCCACHE: "1"
          NODEJS_MOBILE_RESUME: "1"
          SCCACHE_CACHE_SIZE: "10G"
        run: |
          set +e
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370" \
            timeout 285m node packages/node-mobile/scripts/build-android.mjs --arch=${{ matrix.arch }}
          code=$?
          if [ $code -eq 124 ] || [ $code -eq 143 ]; then
            echo "incomplete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $code

      # Saved only on timeout — a completed build has no partial state worth
      # caching. Keyed per-attempt so each re-run restores the latest slice.
      - name: Save partial build tree
        if: steps.build.outputs.incomplete == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/node-mobile/build/node-v26.10.0
          key: nodemobile-tree-${{ matrix.abi }}-${{ github.run_id }}-a${{ github.run_attempt }}

      - name: Resume check
        if: steps.build.outputs.incomplete == 'true'
        run: |
          echo "::error::Build hit the hosted-runner cap — partial tree cached. Use 'Re-run failed jobs' to resume."
          exit 1

      - name: Smoke-check materialized tree + artifact
        run: node packages/node-mobile/scripts/smoke.mjs

      - name: Assemble artifact bundle
        run: |
          mkdir -p artifacts
          # Whole ABI dir — includes libc++_shared.so staged beside libnode.so
          # by build-android.mjs (same-NDK STL pairing matters at runtime).
          tar -czf "artifacts/downdraft-node-mobile-android-${{ matrix.pkgArch }}.tar.gz" \
            -C packages/node-mobile/build/dist/android \
            "${{ matrix.abi }}" include

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: artifacts/downdraft-node-mobile-*.tar.gz
