name: Docs

# Builds the Astro/Starlight site in docs/site and deploys it to GitHub
# Pages. Requires repo Settings -> Pages -> Source = "GitHub Actions".
# To serve under the default project URL instead of the downdraft.dev
# custom domain, set DOCS_SITE=https://<owner>.github.io/downdraft-engine
# and DOCS_BASE=/downdraft-engine/ as workflow env or repository vars.

on:
  push:
    branches: [main, master]
    paths:
      - "docs/site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "docs/site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write # required by actions/deploy-pages

# One Pages deployment at a time; let in-flight deploys finish rather than
# cancelling them mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        working-directory: docs/site
        run: bun ci
      - name: Build
        working-directory: docs/site
        env:
          DOCS_SITE: ${{ vars.DOCS_SITE }}
          DOCS_BASE: ${{ vars.DOCS_BASE }}
        run: bun run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
