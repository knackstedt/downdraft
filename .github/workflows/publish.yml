name: Publish

# Publishes public @downdraft/* packages to npm with provenance.
# Requires npm "trusted publishing" to be configured for each package
# (https://docs.npmjs.com/trusted-publishers) — do a one-off manual
# `npm publish` of each package first, then link this repo/workflow.

on:
  # Release trigger: push a tag named v<version> where <version> matches the
  # @downdraft package version (verified in-job below). All published
  # packages share one version.
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      filter:
        description: "Only publish packages whose name contains this string"
        required: false
        default: ""
      tag:
        description: "npm dist-tag (e.g. next); empty = latest"
        required: false
        default: ""

jobs:
  # One tag drives the whole release: check whether the artifact releases
  # (native-v<version>, node-mobile-v<node>-<rev>) are complete, and if not,
  # call the build workflows as jobs — the DAG does the waiting, and a failed
  # leg fails the run instead of publishing partial binary packages.
  # The native-v<version> release is also fetched by postinstall
  # (fetch-native.mjs) so it must exist regardless of npm publishing.
  plan:
    name: Check artifact releases
    # github.actor is the GitHub account that pushed the tag (or dispatched).
    if: github.actor == 'knackstedt'
    runs-on: ubuntu-latest
    permissions:
      contents: read # gh release view
    outputs:
      needs_native: ${{ steps.check.outputs.needs_native }}
      needs_node_mobile: ${{ steps.check.outputs.needs_node_mobile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NATIVE_REL="native-v$(node -p "require('./packages/platform-native/package.json').version")"
          NM_REL="node-mobile-v$(tr -d '[:space:]' < packages/node-mobile/node-version.txt)-$(grep -oP 'NODE_MOBILE_REVISION \K\d+' packages/node-mobile/overlay/src/node_mobile_version.h)"
          have() { gh release view "$1" --json assets --jq '.assets[].name' 2>/dev/null | grep -c "^$2" || true; }
          n=$(have "$NATIVE_REL" "downdraft-native-"); m=$(have "$NM_REL" "downdraft-node-mobile-")
          echo "$NATIVE_REL: $n/5 bundles | $NM_REL: $m/2 bundles"
          echo "needs_native=$([ "$n" -lt 5 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "needs_node_mobile=$([ "$m" -lt 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Called workflows check out the caller's ref (this tag) and upload their
  # bundles into the native-v*/node-mobile-v* releases.
  native:
    name: Build native artifacts
    needs: plan
    if: needs.plan.outputs.needs_native == 'true'
    permissions:
      contents: write # release upload inside native.yml
    uses: ./.github/workflows/native.yml

  node-mobile:
    name: Build node-mobile artifacts
    needs: plan
    if: needs.plan.outputs.needs_node_mobile == 'true'
    permissions:
      contents: write # release upload inside node-mobile.yml
    uses: ./.github/workflows/node-mobile.yml

  publish:
    name: Publish @downdraft packages
    needs: [plan, native, node-mobile]
    # !failure(): skipped call-jobs are fine (release already complete);
    # a failed build must not publish. Actor gate repeats plan's.
    if: github.actor == 'knackstedt' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for npm --provenance
      contents: read # gh release download
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Tag must be v<version> matching the published package version, and
      # every publishable @downdraft/* package must share that version.
      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node -e '
            const {readdirSync, existsSync, readFileSync} = require("fs");
            const ver = require("./packages/engine/package.json").version;
            if ("'$TAG'" !== ver) {
              console.error(`tag ${"'$TAG'"} does not match @downdraft/engine@${ver}`);
              process.exit(1);
            }
            for (const d of readdirSync("packages")) {
              const f = `packages/${d}/package.json`;
              if (!existsSync(f)) continue;
              const p = JSON.parse(readFileSync(f, "utf8"));
              if (p.name?.startsWith("@downdraft/") && !p.private && p.version !== ver) {
                console.error(`${p.name}@${p.version} is out of lockstep with engine@${ver}`);
                process.exit(1);
              }
            }
          '
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing (OIDC exchange) requires npm >= 11.5.1;
      # node 22 bundles npm 10.x.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@12.1.0
      # scripts/build-dist.mjs (run by publish-packages.mjs) requires the
      # workspace's typescript — install deps before publishing.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Populate packages/native-*/lib/ from the native-v<version> release
      # bundles — the `native` call-job above guarantees it exists complete
      # by the time this job runs (or this job was skipped).
      - name: Stage native platform packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./packages/platform-native/package.json').version")
          mkdir -p /tmp/native-bundles
          gh release download "native-v${VER}" --pattern 'downdraft-native-*.tar.gz' --dir /tmp/native-bundles
          node scripts/stage-native-packages.mjs /tmp/native-bundles
      # Populate packages/native-mobile-android-*/{lib,include} from the
      # node-mobile-v<node version>-<revision> release (built by
      # node-mobile.yml).
      - name: Stage node-mobile packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(tr -d '[:space:]' < packages/node-mobile/node-version.txt)
          REV=$(grep -oP 'NODE_MOBILE_REVISION \K\d+' packages/node-mobile/overlay/src/node_mobile_version.h)
          mkdir -p /tmp/node-mobile-bundles
          gh release download "node-mobile-v${VER}-${REV}" --pattern 'downdraft-node-mobile-*.tar.gz' --dir /tmp/node-mobile-bundles
          node scripts/stage-node-packages.mjs /tmp/node-mobile-bundles
      - name: Publish packages in dependency order
        run: |
          FILTER="${{ inputs.filter }}"
          TAG="${{ inputs.tag }}"
          # A pushed prerelease tag must not claim `latest`: when no explicit
          # dispatch tag is given and the version carries a prerelease
          # suffix, publish under `next` instead.
          if [ -z "$TAG" ]; then
            case "$(node -p "require('./packages/engine/package.json').version")" in
              *-*) TAG=next ;;
            esac
          fi
          ARGS=""
          [ -n "$FILTER" ] && ARGS="--filter=$FILTER"
          [ -n "$TAG" ] && ARGS="$ARGS --tag=$TAG"
          node scripts/publish-packages.mjs $ARGS
