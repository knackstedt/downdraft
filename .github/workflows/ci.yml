name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# NOTE: games live in separate repos and are gitignored here — engine CI is
# self-contained and never builds or typechecks game code.

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run tsc
      - name: Check generated deno.json is in sync
        run: node scripts/gen-deno-import-map.mjs --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests
        # Run ALL package specs — previously this was a hardcoded subset that
        # silently drifted out of date (~15 of 228 spec files). bun test
        # discovers every *.spec.ts under the given directory.
        run: bun test packages/
      - name: Check engine exports map is in sync
        run: node scripts/gen-engine-exports.mjs --check

  plugin-tests:
    name: Plugin Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run plugin-tester specs
        run: bun test examples/plugin-tester/src/*.spec.ts
