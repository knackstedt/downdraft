name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run tsc
      - name: Check generated deno.json is in sync
        run: node scripts/gen-deno-import-map.mjs --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
        continue-on-error: true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: |
          bun test packages/core/src/ecs/world.spec.ts \
            packages/core/src/render/frustum.spec.ts \
            packages/core/src/telemetry/collector.spec.ts \
            packages/core/src/physics/*.spec.ts \
            packages/libraries/physics-rapier/src/*.spec.ts \
            packages/shader-graph/src/graph.spec.ts \
            packages/shader-graph/src/compute-compiler.spec.ts \
            packages/core/src/render/bindless/bindless.spec.ts \
            packages/core/src/material/material.spec.ts \
            packages/core/src/material/variants.spec.ts \
            packages/libraries/models/src/material-adapter.spec.ts \
            packages/core/src/assets/model-normalizer.spec.ts \
            packages/libraries/models/src/bake-node-transforms.spec.ts \
            packages/libraries/models/src/sidecar/sidecar.spec.ts \
            packages/libraries/models/src/normalize.spec.ts \
            packages/app/src/main/storage.spec.ts

  plugin-tests:
    name: Plugin Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run plugin-tester specs
        run: bun test examples/plugin-tester/src/*.spec.ts

  e2e-tests:
    name: E2E Smoke Test (SwiftShader)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run to-the-ocean E2E smoke test
        run: bun run draft:test-cpu
        timeout-minutes: 10
      - name: Run overburden E2E smoke test
        run: bun run draft:test-cpu -- --game overburden
        timeout-minutes: 10
      - name: Run sandjongg E2E smoke test
        run: bun run draft:test-cpu -- --game sandjongg
        timeout-minutes: 10
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/artifacts/
          if-no-files-found: ignore
