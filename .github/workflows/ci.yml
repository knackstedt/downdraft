name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run tsc
      - name: Check generated deno.json is in sync
        run: node scripts/gen-deno-import-map.mjs --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
        continue-on-error: true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: |
          bun test packages/engine/core/src/ecs/world.spec.ts \
            packages/engine/core/src/render/frustum.spec.ts \
            packages/engine/core/src/telemetry/collector.spec.ts \
            packages/engine/core/src/physics/*.spec.ts \
            packages/engine/libraries/physics-rapier/src/*.spec.ts \
            packages/engine/shader-graph/src/graph.spec.ts \
            packages/engine/shader-graph/src/compute-compiler.spec.ts \
            packages/engine/core/src/render/bindless/bindless.spec.ts \
            packages/engine/core/src/material/material.spec.ts \
            packages/engine/core/src/material/variants.spec.ts \
            packages/engine/libraries/models/src/material-adapter.spec.ts \
            packages/engine/core/src/assets/model-normalizer.spec.ts \
            packages/engine/libraries/models/src/bake-node-transforms.spec.ts \
            packages/engine/libraries/models/src/sidecar/sidecar.spec.ts \
            packages/engine/libraries/models/src/normalize.spec.ts \
            packages/engine/app/src/main/storage.spec.ts
      - name: Check engine exports map is in sync
        run: node scripts/gen-engine-exports.mjs --check

  plugin-tests:
    name: Plugin Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run plugin-tester specs
        run: bun test examples/plugin-tester/src/*.spec.ts
