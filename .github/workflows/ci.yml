name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# NOTE: apps live in separate repos and are gitignored here — engine CI is
# self-contained and never builds or typechecks app code.

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun ci
      - name: Type check
        run: bun run tsc
      - name: Check generated deno.json is in sync
        run: node scripts/gen-deno-import-map.mjs --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun ci
      - name: Lint
        run: bun run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun ci
      - name: Run unit tests
        # Run ALL package specs — previously this was a hardcoded subset that
        # silently drifted out of date (~15 of 228 spec files). bun test
        # discovers every *.spec.ts under the given directory.
        # --isolate gives each file a fresh global object: without it, shared
        # module/GC state across files corrupts the rapier WASM instance
        # (validated-api.spec.ts traps with "Unreachable code" mid-step).
        # --conditions=downdraft-source resolves @downdraft/* self-imports to
        # src/ — dist/ doesn't exist in a fresh checkout (built at publish).
        run: bun test --isolate --conditions=downdraft-source --path-ignore-patterns "**/node-mobile/build/**" packages/
      - name: Check engine exports map is in sync
        run: node scripts/gen-engine-exports.mjs --check

  plugin-tests:
    name: Plugin Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun ci
      - name: Run plugin-tester specs
        # downdraft-source: @downdraft/* resolves to src/ — dist/ is absent
        # in a fresh checkout (it only exists after a publish-time build).
        run: bun test --conditions=downdraft-source examples/plugin-tester/src/*.spec.ts

  cross-platform-smoke:
    name: Cross-Platform Smoke (win/mac)
    # Native cdylib builds for win/mac/linux run in native.yml on tags; this
    # job covers the pure-TypeScript surface (arg parsing, MCP transport,
    # filesystem-backed persistence) on the other OSes on every PR.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun ci
      - name: Run smoke specs
        run: >
          bun test --isolate --conditions=downdraft-source
          packages/cli/src/args.spec.ts
          packages/engine/mcp/src/http-transport.spec.ts
          packages/engine/libraries/persistence/src/file-save-store.spec.ts
          packages/engine/libraries/persistence/src/binary-record-store.spec.ts
          packages/engine/libraries/persistence/src/directory-save-store.spec.ts

  cargo-deny:
    name: cargo-deny (licenses + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses advisories

  npm-licenses:
    name: npm license check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun ci
      - name: Audit licenses
        # Hard-fail on copyleft licenses — compiled binaries embed these
        # packages. Runs without --production because the root manifest is a
        # workspace: per-package production deps are devDeps of the root and
        # would otherwise go unaudited.
        run: bunx license-checker --failOn "GPL;LGPL;AGPL;SSPL;CPAL;OSL"

  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same pkg-config dep set as native.yml (cpal/alsa, gilrs/udev,
      # winit/wayland-xkb, keyring/dbus, fontique/fontconfig; python3 for
      # stylo mako codegen).
      - name: Install Linux system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3 libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libfontconfig-dev
      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup toolchain install --profile minimal
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        # webui-cef excluded: cef-dll-sys downloads the pinned CEF binary
        # distribution at build-script time and the vendor tree is absent in
        # CI checkouts. webui-wpe checks fine without its vendor prefix.
        run: cargo clippy --workspace --exclude downdraft-webui-cef
      - name: cargo test
        run: cargo test -p downdraft-platform

  gpu-smoke:
    name: GPU Smoke (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      # postinstall (fetch-native.mjs) pulls the published native bundle —
      # the cdylib these specs dlopen.
      - name: Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun ci
      - name: Install software Vulkan driver
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers
      - name: Run GPU smoke specs
        # DOWNDRAFT_GPU=swiftshader forces wgpu's fallback adapter (lavapipe).
        # DD_REQUIRE_GPU turns the adapter-absent skip in these specs into a
        # hard failure — this job exists to prove the render path works.
        env:
          DOWNDRAFT_GPU: swiftshader
          DD_REQUIRE_GPU: "1"
        run: >
          bun test --isolate --conditions=downdraft-source
          packages/platform-native/src/gpu/render-smoke.spec.ts
          packages/engine/core/src/assets/loader-texture-e2e.spec.ts
          packages/engine/core/src/render/shader-sweep.spec.ts
          packages/engine/core/src/render/perf-gates.spec.ts

      - name: Run render benchmarks
        # Informational, not gating — wall-clock numbers on shared runners
        # under lavapipe are too noisy for thresholds. Deterministic
        # work-count invariants live in perf-gates.spec.ts (run above);
        # these tables give regression visibility via artifacts.
        env:
          DOWNDRAFT_GPU: swiftshader
        run: |
          mkdir -p bench-results
          for f in packages/engine/bench/*.ts; do
            echo "=== $f ===" | tee -a bench-results/output.txt
            bun --conditions=downdraft-source "$f" | tee -a bench-results/output.txt
          done
      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench-results/output.txt
          if-no-files-found: ignore
