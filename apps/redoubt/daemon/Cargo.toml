# Standalone workspace — NOT a member of the root engine workspace (the root
# workspace is for engine cdylibs; this is an app-level binary). Mirrors the
# games/downdraft-gpu-bench/native/ layout.
[workspace]

[package]
name = "redoubtd"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
dirs = "6"
keyring = { version = "3", features = ["linux-native-sync-persistent"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
